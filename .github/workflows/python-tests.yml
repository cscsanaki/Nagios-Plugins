name: Plugin tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: |
          python --version

      - name: Compile Python plugins
        run: |
          python -m compileall -q plugins/

      - name: Check check_dnf.py version
        run: |
          python plugins/check_dnf.py --version

      - name: Check check_dnf.py help
        run: |
          python plugins/check_dnf.py --help

      - name: Check check_dnf.py unit tests
        run: |
          python -m unittest discover -s tests -p 'test_check_dnf.py' -v

      - name: Check LibreNMS plugin shell syntax
        run: |
          bash -n plugins/check_librenms_validate

      - name: Check LibreNMS plugin CLI
        run: |
          bash plugins/check_librenms_validate --version
          bash plugins/check_librenms_validate --help

      - name: Run LibreNMS plugin tests
        run: |
          bash tests/test_check_librenms_validate.sh

      - name: Check HPE plugin syntax
        run: |
          python -m py_compile plugins/check_hpe_hardware.py

      - name: Check HPE plugin CLI
        run: |
          python plugins/check_hpe_hardware.py --version
          python plugins/check_hpe_hardware.py --help

      - name: Run HPE plugin tests
        run: |
          python -m unittest tests/test_check_hpe_hardware.py -v

      - name: Check ssacli plugin shell syntax
        run: |
          chmod +x plugins/check_ssacli_disks.sh
          chmod +x tests/test_check_ssacli_disks.sh
          bash -n plugins/check_ssacli_disks.sh
          bash -n tests/test_check_ssacli_disks.sh

      - name: Check ssacli plugin CLI
        run: |
          bash plugins/check_ssacli_disks.sh --version
          bash plugins/check_ssacli_disks.sh --help

      - name: Run ssacli plugin tests
        run: |
          bash tests/test_check_ssacli_disks.sh      

      - name: Check for committed Python bytecode
        run: |
          if git ls-files | grep -E '\.(pyc|pyo)$'; then
            echo "Committed Python bytecode file found in repository"
            exit 1
          fi

      - name: Check for legacy YUM references
        run: |
          if grep -RniE '\b[Yy][Uu][Mm]\b|check_yum' \
              plugins/ docs/ README.md CHANGELOG.md; then
            echo "Legacy YUM reference found"
            exit 1
          fi
